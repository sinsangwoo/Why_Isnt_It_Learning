name: CI

on:
  push:
    branches: [main, "phase*", "feature/*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1: Lint — fast feedback, scoped to src/ + tests/cli/ only.
  # Legacy test files outside tests/cli/ are excluded intentionally;
  # they predate the ruff config and will be cleaned up separately.
  # ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.1.0"

      - name: Run ruff (src/ + tests/cli/ only)
        run: ruff check src/ tests/cli/

  # ────────────────────────────────────────────────────────────────────
  # Job 2: Type-check — mypy scoped to the new cli/ package.
  # ────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + mypy
        run: |
          pip install -e ".[dev]"
          pip install "mypy>=1.0.0"

      - name: Run mypy (cli/ only)
        run: mypy src/gradient_pathology/cli/

  # ────────────────────────────────────────────────────────────────────
  # Job 3: Unit + integration tests — matrix over Python versions.
  # lint must pass first; typecheck runs in parallel.
  # ────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.python-version }}-

      - name: Install package + test dependencies
        run: pip install -e ".[dev]"

      # ── CLI unit tests ────────────────────────────────────────────
      - name: Unit tests — cli.config
        run: |
          pytest tests/cli/test_config.py -v \
            --tb=short \
            --cov=src/gradient_pathology/cli \
            --cov-report=term-missing

      - name: Unit tests — cli.report
        run: |
          pytest tests/cli/test_report.py -v \
            --tb=short \
            --cov=src/gradient_pathology/cli \
            --cov-append \
            --cov-report=term-missing

      # ── CLI entrypoint smoke tests ────────────────────────────────
      - name: Smoke tests — entrypoint
        run: |
          pytest tests/cli/test_entrypoint.py -v \
            --tb=short \
            --cov=src/gradient_pathology/cli \
            --cov-append \
            --cov-report=term-missing

      # ── Full pipeline integration tests ───────────────────────────
      - name: Integration tests — pipeline
        run: |
          pytest tests/cli/test_pipeline.py -v \
            --tb=short \
            --cov=src/gradient_pathology/cli \
            --cov-append \
            --cov-report=term-missing:coverage.txt \
            --cov-report=xml:coverage.xml

      # ── Legacy test suite (pre-Phase-1, may have known failures) ──
      - name: Legacy tests (non-blocking)
        run: pytest tests/ --ignore=tests/cli -v --tb=short || true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: cli
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────
  # Job 4: CLI smoke-test via installed entrypoint
  # ────────────────────────────────────────────────────────────────────
  cli-smoke:
    name: CLI entrypoint smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: pathology-diagnose --help
        run: pathology-diagnose --help

      - name: pathology-diagnose (quick run, JSON output)
        run: |
          pathology-diagnose \
            --num-steps 5 \
            --output-dir /tmp/smoke_output \
            --report-format json
          python - <<'EOF'
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/smoke_output/report.json').read_text())
          assert 'global' in data
          assert 'layers' in data
          assert len(data['layers']) > 0
          print('Smoke test passed:', len(data['layers']), 'layers analysed')
          EOF

      - name: pathology-diagnose with JSON config
        run: |
          pathology-diagnose \
            --config configs/example_config.json \
            --num-steps 3 \
            --output-dir /tmp/cfg_test

      - name: pathology-diagnose --quiet
        run: pathology-diagnose --num-steps 3 --quiet

  # ────────────────────────────────────────────────────────────────────
  # Job 5: Build check — wheel + sdist + twine
  # ────────────────────────────────────────────────────────────────────
  build:
    name: Build check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distribution
        run: twine check dist/*
