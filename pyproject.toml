[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-pathology"
version = "0.5.0"
description = "Automated gradient pathology detection and analysis"
authors = [{name = "Sangwoo Sin"}]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.20.0"]
storage = ["pandas>=1.5.0", "pyarrow>=12.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pandas>=1.5.0",
    "pyarrow>=12.0.0",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "torchvision",
    "torchvision.*",
    "matplotlib",
    "matplotlib.*",
    "tqdm",
    "tqdm.*",
    "streamlit",
    "streamlit.*",
    "networkx",
    "networkx.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"
