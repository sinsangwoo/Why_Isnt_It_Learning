[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-pathology"
version = "0.4.0"
description = "Automated gradient pathology detection and analysis"
authors = [{name = "Sangwoo Sin"}]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.20.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "types-tqdm>=4.66.0",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "torchvision",
    "torchvision.*",
    "matplotlib",
    "matplotlib.*",
    "tqdm",
    "tqdm.*",
    "streamlit",
    "streamlit.*",
    "networkx",
    "networkx.*",
    "mlflow",
    "mlflow.*",
    "ray",
    "ray.*",
    "pytorch_lightning",
    "pytorch_lightning.*",
]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/gradient_pathology --cov-report=term-missing"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
